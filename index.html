<title>Immobiliendarlehen · Beratungswerkzeug</title>
<style>
  :root {
    /* Weiß · Graphit · Glass. Farbakzente nur für Signale (positiv/warnung). */
    --bg:        #f4f5f7;
    --bg-elev:   #ffffff;
    --bg-soft:   #f7f8fa;
    --ink:       #171a1c;
    --ink-soft:  #3d4247;
    --ink-mute:  #86898c;
    --rail:      rgba(255,255,255,0.70);
    --line:      rgba(23,26,28,0.16);
    --line-soft: rgba(23,26,28,0.08);
    --line-strong: rgba(23,26,28,0.24);
    --glass:      rgba(255,255,255,0.65);
    --glass-hi:   rgba(255,255,255,0.85);
    --glass-lo:   rgba(255,255,255,0.45);
    --glass-border: rgba(255,255,255,0.6);
    --graphite:      #1e2226;
    --graphite-deep: #0f1113;
    --graphite-tint: rgba(30,34,38,0.05);
    /* Signalfarben — sparsam */
    --brick:      var(--graphite);     /* Kompatibilität: „brick"-Referenzen sind jetzt Graphit */
    --brick-deep: var(--graphite-deep);
    --brick-tint: var(--graphite-tint);
    --brass:      #8a7a4a;
    --sage:       #5f7a52;
    --danger:     #a94a3a;
    --shadow:    0 1px 2px rgba(23,26,28,0.03), 0 8px 24px rgba(23,26,28,0.06);
    --shadow-lg: 0 2px 4px rgba(23,26,28,0.04), 0 24px 60px rgba(23,26,28,0.10);
    --radius: 14px;
    --radius-sm: 8px;
    --serif: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(255,255,255,0.9), transparent 55%),
      radial-gradient(900px 700px at 100% 10%, rgba(220,225,232,0.6), transparent 55%),
      radial-gradient(1000px 900px at 50% 110%, rgba(200,210,220,0.35), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }

  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; max-width: 1440px; margin: 0 auto; }
  @media (max-width: 960px) { .app { grid-template-columns: 1fr; } }

  .rail {
    background: var(--rail);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    padding: 36px 28px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 28px;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-mark { font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
  .brand-sub { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: var(--ink-mute); }
  .rail-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: .18em; color: var(--ink-mute); font-weight: 700; margin-bottom: 12px; }

  .steps { display: flex; flex-direction: column; gap: 1px; }
  .step-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-soft); font-size: 13px; transition: color .15s; user-select: none; }
  .step-item:hover { color: var(--ink); }
  .step-item.active { color: var(--ink); font-weight: 600; }
  .step-num { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: transparent; color: var(--ink-mute); border: 1.5px solid var(--line); flex-shrink: 0; font-variant-numeric: tabular-nums; transition: all .2s; }
  .step-item.active .step-num { border-color: var(--graphite); color: var(--graphite); background: #fff; }
  .step-item.done .step-num { background: var(--graphite); border-color: var(--graphite); color: #fff; }

  .live-summary {
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow);
  }
  .ls-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
  .ls-row .k { color: var(--ink-mute); }
  .ls-row .v { font-family: var(--serif); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .ls-row .v.empty { color: var(--ink-mute); font-style: italic; font-weight: 400; font-family: var(--sans); font-size: 12px; }
  .ls-row .v.hero { color: var(--ink); font-size: 16px; font-weight: 600; }
  .ls-divider { height: 1px; background: var(--line-soft); margin: 2px 0; }

  .theme-toggle { display: none; }

  .stage { padding: 48px 56px 100px; max-width: 100%; overflow-x: hidden; }
  @media (max-width: 700px) { .stage { padding: 28px 20px 60px; } }

  .step-hd {
    font-size: 11px; text-transform: uppercase; letter-spacing: .22em;
    color: var(--ink-mute); font-weight: 600;
    margin-bottom: 16px;
  }
  .step-title {
    font-family: var(--serif); font-size: 44px; font-weight: 500;
    line-height: 1.08; letter-spacing: -0.025em;
    margin: 0 0 18px; text-wrap: balance; color: var(--ink);
  }
  .step-lede { font-size: 17px; color: var(--ink-soft); max-width: 62ch; margin: 0 0 40px; line-height: 1.5; }

  .card {
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    padding: 32px 36px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card h3 {
    font-family: var(--serif); font-size: 20px;
    margin: 0 0 4px; font-weight: 600; letter-spacing: -0.015em;
    color: var(--ink);
  }
  .card .hint { font-size: 14px; color: var(--ink-mute); margin: 0 0 22px; }

  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-mute); font-weight: 700; }
  .input, .select {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink); font-size: 15px; font-family: inherit;
    font-variant-numeric: tabular-nums;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .input:hover { border-color: var(--line-strong); background: rgba(255,255,255,0.9); }
  .input:focus, .select:focus { outline: none; border-color: var(--graphite); box-shadow: 0 0 0 3px var(--graphite-tint); background: #fff; }
  .input:disabled { background: rgba(247,248,250,0.7); color: var(--ink-mute); cursor: not-allowed; }
  .input-suffix { position: relative; }
  .input-suffix .suf { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-mute); font-size: 13px; pointer-events: none; }
  .input-suffix .input { padding-right: 40px; }

  /* Choice cards */
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .choice {
    border: 1px solid var(--line-strong); border-radius: 12px;
    padding: 20px 18px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    cursor: pointer; text-align: left;
    transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
    font-family: inherit; color: var(--ink);
    display: flex; flex-direction: column; gap: 6px;
  }
  .choice:hover { transform: translateY(-1px); border-color: var(--line-strong); background: rgba(255,255,255,0.85); box-shadow: var(--shadow); }
  .choice.selected { border-color: var(--graphite); background: rgba(255,255,255,0.95); box-shadow: 0 0 0 3px var(--graphite-tint); }
  .choice-title { font-family: var(--sans); font-size: 15px; font-weight: 600; letter-spacing: -0.005em; }
  .choice-sub { font-size: 12px; color: var(--ink-mute); line-height: 1.45; }

  /* Slider */
  .slider-block { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .slider-block:last-child { margin-bottom: 0; }
  .slider-hd { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .slider-label { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .slider-val { font-family: var(--serif); font-size: 22px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; transition: color .2s; letter-spacing: -0.01em; }
  .slider-val.pulse { animation: pulse .35s ease; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 5px; background: var(--line); border-radius: 99px; outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--graphite); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.18); cursor: grab; transition: transform .1s; }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.12); }
  input[type=range]::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.18); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--graphite); border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.18); cursor: grab; }
  .slider-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }

  /* Try-it suggestion chips */
  .try-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .try-label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-mute); font-weight: 700; margin-right: 4px; }
  .try-chip { background: transparent; border: 1px dashed var(--line); padding: 6px 12px; border-radius: 99px; font-size: 12px; color: var(--ink-soft); cursor: pointer; font-family: inherit; transition: all .15s; }
  .try-chip:hover { background: var(--graphite-tint); border-color: var(--graphite); border-style: solid; color: var(--graphite); }
  .try-chip.on { background: var(--graphite); border-color: var(--graphite); border-style: solid; color: #fff; }

  /* Metrics */
  .impact-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .impact-grid { grid-template-columns: 1fr; } }
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .metrics .metric.hero { grid-column: 1 / -1; }
  .metric { background: var(--bg-soft); border-radius: var(--radius-sm); padding: 14px 16px; border: 1px solid var(--line); }
  .metric-label { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-mute); font-weight: 700; }
  .metric-val { font-family: var(--serif); font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; line-height: 1.1; transition: color .2s; }
  .metric-val.small { font-size: 20px; }
  .metric-sub { font-size: 12px; color: var(--ink-mute); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .metric.hero {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(200,205,212,0.35), rgba(170,177,186,0.28));
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1.5px solid var(--line-strong);
    color: var(--ink); padding: 22px 24px;
    box-shadow: 0 10px 40px rgba(23,26,28,0.08);
  }
  .metric.hero .metric-label { color: var(--ink-soft); }
  .metric.hero .metric-val { font-size: 36px; color: var(--ink); font-weight: 500; }
  .metric.hero .metric-sub { color: var(--ink-mute); }

  .chart-wrap { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; border: 1px solid var(--line-soft); }
  canvas { display: block; max-width: 100%; }
  .chart-wrap canvas { width: 100%; height: auto; }
  .obj-pie canvas { width: 180px; height: 180px; }
  .legend { display:flex;gap:16px;justify-content:center;font-size:12px;margin-top:10px;color:var(--ink-soft); flex-wrap: wrap; }
  .legend > span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 12px; height: 12px; border-radius: 2px; }

  /* Trade-off scale */
  .tradeoff { background: var(--bg-soft); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 16px 18px; margin-top: 14px; }
  .tradeoff-hd { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-mute); font-weight: 700; margin-bottom: 10px; }
  .tradeoff-bar { position: relative; height: 8px; background: linear-gradient(90deg, var(--sage) 0%, var(--sage) 30%, var(--brass) 50%, var(--danger) 85%, var(--danger) 100%); border-radius: 99px; }
  .tradeoff-marker { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--bg-elev); border: 3px solid var(--ink); transform: translate(-50%, -50%); transition: left .5s cubic-bezier(.2,.8,.2,1); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .tradeoff-labels { display: flex; justify-content: space-between; font-size: 11px; margin-top: 10px; color: var(--ink-mute); }
  .tradeoff-verdict { font-size: 13px; margin-top: 12px; color: var(--ink-soft); }
  .tradeoff-verdict b { color: var(--ink); }

  /* Toggle switch */
  .switch { display: inline-flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
  .switch-track { width: 44px; height: 24px; background: var(--line); border-radius: 99px; position: relative; transition: background .2s; flex-shrink: 0; }
  .switch-thumb { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch input { display: none; }
  .switch input:checked + .switch-track { background: var(--graphite); }
  .switch input:checked + .switch-track .switch-thumb { left: 22px; }

  /* Income table */
  .inc-tbl { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  .inc-tbl th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-mute); font-weight: 700; padding: 4px 8px; }
  .inc-tbl th.num { text-align: right; }
  .inc-tbl td { padding: 0 4px; }
  .inc-tbl td.lbl { font-size: 13px; color: var(--ink); padding-left: 8px; white-space: nowrap; }
  .inc-tbl td .input { padding: 8px 12px; font-size: 14px; text-align: right; }
  .inc-tbl td .input-suffix .input { padding-right: 34px; }
  .inc-tbl td .input-suffix .suf { right: 10px; font-size: 12px; }
  .p2col.hide { display: none; }
  .autoval { font-family: var(--serif); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }

  /* Dynamic list rows */
  .row-list { display: flex; flex-direction: column; gap: 8px; }
  .row-item { display: grid; grid-template-columns: 1fr 1fr 36px; gap: 10px; align-items: end; padding: 12px; background: var(--bg-soft); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); }
  .row-item.one { grid-template-columns: 1fr 36px; }
  .row-item .rowinfo { grid-column: 1 / -1; font-size: 12px; color: var(--ink-mute); margin-top: -2px; }
  .row-item .rowinfo b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .del { width: 36px; height: 40px; border: none; background: transparent; border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-mute); font-size: 16px; transition: all .15s; }
  .del:hover { background: var(--danger); color: white; }
  .row-add { margin-top: 8px; background: transparent; border: 1px dashed var(--line); padding: 8px 14px; border-radius: var(--radius-sm); font-size: 12px; color: var(--ink-soft); cursor: pointer; font-family: inherit; transition: all .15s; }
  .row-add:hover { border-color: var(--graphite); border-style: solid; color: var(--graphite); background: var(--graphite-tint); }

  /* Category chip row (progressive disclosure) */
  .cat-header { font-size: 13px; color: var(--ink-mute); margin-bottom: 10px; }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .cat-chip { background: transparent; border: 1.5px solid var(--line); padding: 8px 14px; border-radius: 99px; font-size: 13px; color: var(--ink-soft); cursor: pointer; font-family: inherit; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .cat-chip:hover { border-color: var(--graphite); color: var(--graphite); }
  .cat-chip.on { background: var(--graphite); border-color: var(--graphite); color: #fff; }
  .cat-chip .plus { font-size: 14px; transition: transform .2s; }
  .cat-chip.on .plus { transform: rotate(45deg); }

  .cat-section { margin-top: 14px; padding: 16px; background: var(--bg-soft); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); animation: fadeUp .25s ease-out; }
  .cat-section h4 { font-family: var(--serif); font-size: 15px; margin: 0 0 4px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .cat-section h4 .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-mute); font-weight: 600; }
  .cat-section p.sub { font-size: 12px; color: var(--ink-mute); margin: 0 0 12px; }

  /* Sum bar */
  .sum-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(23,26,28,0.04);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 20px; margin-top: 8px;
  }
  .sum-bar .l { font-size: 12px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .12em; }
  .sum-bar .v { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

  /* Spielraum hero — glasig transparent grau */
  .spielraum {
    background: linear-gradient(135deg, rgba(200,205,212,0.35), rgba(170,177,186,0.28));
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1.5px solid var(--line-strong);
    color: var(--ink);
    border-radius: 16px;
    padding: 32px 32px;
    text-align: center;
    margin-top: 8px;
    box-shadow: 0 10px 40px rgba(23,26,28,0.08);
  }
  .spielraum .eyb { font-size: 11px; text-transform: uppercase; letter-spacing: .22em; color: var(--ink-soft); font-weight: 600; }
  .spielraum .val { font-family: var(--serif); font-size: 56px; font-weight: 500; margin: 10px 0 6px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: var(--ink); }
  .spielraum .sub { font-size: 13px; color: var(--ink-mute); }

  .scen-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
  @media(max-width: 600px) { .scen-grid { grid-template-columns: 1fr; } }
  /* Szenario-Kacheln — helle, kräftig-transparente Glaskacheln */
  .scen-card {
    border-radius: 12px; padding: 18px; text-align: center;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 6px 24px rgba(23,26,28,0.06);
  }
  .scen-card.k { background: linear-gradient(135deg, rgba(120,200,140,0.28), rgba(120,200,140,0.14)); border: 1.5px solid rgba(80,150,95,0.55); }
  .scen-card.a { background: linear-gradient(135deg, rgba(240,200,120,0.32), rgba(240,200,120,0.16)); border: 1.5px solid rgba(190,150,60,0.55); }
  .scen-card.o { background: linear-gradient(135deg, rgba(240,140,130,0.30), rgba(240,140,130,0.16)); border: 1.5px solid rgba(200,80,70,0.50); }
  .scen-card .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--ink); }
  .scen-card.k .lbl { color: #2f6a3f; }
  .scen-card.a .lbl { color: #8a6a1a; }
  .scen-card.o .lbl { color: #a04030; }
  .scen-card .price { font-family: var(--serif); font-size: 22px; font-weight: 600; margin-top: 8px; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -0.015em; }
  .scen-card .rate { font-size: 12px; color: var(--ink-soft); margin-top: 3px; font-variant-numeric: tabular-nums; }

  /* Navigation */
  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; gap: 12px; }
  .btn {
    padding: 13px 34px; border-radius: 999px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    border: 1px solid transparent; cursor: pointer; font-family: inherit;
    transition: transform .12s, background .15s, border-color .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: rgba(23,26,28,0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #fff;
    border-color: rgba(23,26,28,0.88);
  }
  .btn-primary:hover { background: var(--graphite-deep); border-color: var(--graphite-deep); }

<script>
/* ============================================================
   KONDITIONEN (aus vorhandener Bausparkassen-Vorlage)
   ============================================================ */
const KOND = {
  haushaltspauschale: {
    ohneMiete: { p1: 890,  p2: 1230, jeWeiterePerson: 255 },
    mitMiete:  { p1: 1340, p2: 1680, jeWeiterePerson: 255 },
  },
  darlehensAnsatz: { wuestenrot: 0.06, fremd: 0.09 },
  kindergeld: 259,
  annuitaetKapitalisierung: 0.06,
  mietansatz: 0.80,
  wohnfoerderung: { antragsteller: 540, kind: 300 }, // €/Jahr — Wohnförderung 2027
};

/* ============================================================
   STATE
   ============================================================ */
const state = {
  step: 0,
  data: {
    // DSGVO: kein Name gespeichert
    person2: false,
    lohn1: 0, lohn2: 0,
    gewinn1: 0, gewinn2: 0,
    rente1: 0, rente2: 0,
    sonst1: 0, sonst2: 0,
    kinder: 0,
    mieten: [],           // [{ id, wert }]  -- normale Mieteinnahmen (fremde Objekte)
    teilvermietungMiete: 0, // Miete aus der teilvermieteten Immobilie (nur bei usage='mixed')
    mieteKalt: 0,
    pkv: 0,
    sonstAusgabe: 0,
    wuesten: [],          // [{ id, rate, rest }]
    fremd: [],            // [{ id, rate, rest }]
    kredite: [],          // [{ id, rate }]
    unterhalt: [],        // [{ id, rate }]
    activeCats: new Set(),// welche Kategorien angeklickt wurden

    usage: '',
    propertyPrice: 350000,
    nkGrESt:  { on: true, pct: 6.5 },   // NRW: 6,5 %
    nkNotar:  { on: true, pct: 2.0 },   // Notar + Grundbuch
    nkMakler: { on: true, pct: 3.57 },  // Käuferanteil in NRW
    extraCosts: 0,                       // wird abgeleitet (Grunderwerbst./Notar/Makler)
    renoCosts: 0,                        // geplante Renovierung — fließt in Gesamtkosten, NICHT in NK-Basis
    equity: 30000,
    wishRate: 0, wishRateTouched: false,
    maxRate: 0,  maxRateTouched: false,
    sondertilgungPrio: '',   // '' | 'wichtig' | 'nicht' | 'nett' | 'egal'
    ratenanpassung: false,
    wohnfoerderungOptIn: false,
    kfw: false, regional: false,
    criteria: [],            // [{ id, text, done }] — Muss-Kriterien im Summary
    hasObject: false,        // Kunde hat konkretes Objekt im Blick
    obj: {
      typ: '',               // 'efh' | 'zfh' | 'ewg'
      strasse: '', hausnr: '', plz: '', ort: '',
      wohnflaeche: 0,
      wohnflaeche2: 0,       // nur bei ZFH
      grundstueck: 0,
      baujahr: 0,
      bauart: '',            // Massivbau / Fertighaus / Mischbauweise / Sonstige
      vollgeschosse: 0,
      dgAusgebaut: false,
      keller: '',            // 'voll' | 'teil' | 'ohne'
      etage: '',             // nur bei EWG
      einheitenGebaeude: 0,  // nur bei EWG
      modVergangen: '',
      modGeplant: '',
    },
  },
};

const STEPS = [
  { id: 'intro',   title: 'Willkommen' },
  { id: 'person',  title: 'Nutzung & Situation' },
  { id: 'object',  title: 'Immobilie & Eigenkapital' },
  { id: 'rates',   title: 'Wunsch- und Maximalrate' },
  { id: 'pref',    title: 'Präferenzen & Förderung' },
  { id: 'summary', title: 'Zusammenfassung' },
];

/* ============================================================
   HELPERS
   ============================================================ */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const fmtEUR = n => new Intl.NumberFormat('de-DE', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(Math.round(n||0));
const fmtPct = n => new Intl.NumberFormat('de-DE', { minimumFractionDigits:1, maximumFractionDigits:2 }).format(n||0) + ' %';
const fmtYear = n => { const y = Math.round(n); return y === 1 ? '1 Jahr' : `${y} Jahre`; };
const uid = () => Math.random().toString(36).slice(2, 9);
const numFrom = v => Number(String(v||'').replace(',','.')) || 0;

function tweenNumber(el, from, to, fmt, ms = 400) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(to); return; }
  const start = performance.now();
  function frame(t) {
    const p = Math.min(1, (t - start) / ms);
    const eased = 1 - Math.pow(1 - p, 3);
    const v = from + (to - from) * eased;
    el.textContent = fmt(v);
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function setMetric(id, value, fmt = fmtEUR) {
  const el = document.getElementById(id); if (!el) return;
  const prev = parseFloat(el.dataset.raw || '0');
  el.dataset.raw = value;
  tweenNumber(el, prev, value, fmt);
}
function pulseEl(el) { if (!el) return; el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }

/* ============================================================
   HAUSHALT / FINANZBILD
   ============================================================ */
function recomputeExtraCosts() {
  const d = state.data;
  const nkPct = (d.nkGrESt.on ? d.nkGrESt.pct : 0)
              + (d.nkNotar.on ? d.nkNotar.pct : 0)
              + (d.nkMakler.on ? d.nkMakler.pct : 0);
  d.extraCosts = Math.round(d.propertyPrice * nkPct / 100);
  return { nkPct, extraCosts: d.extraCosts };
}

function haushaltGroesse() {
  return 1 + (state.data.person2 ? 1 : 0) + Math.max(0, state.data.kinder|0);
}
function pauschaleFor(personen, mitMiete) {
  const t = mitMiete ? KOND.haushaltspauschale.mitMiete : KOND.haushaltspauschale.ohneMiete;
  if (personen <= 1) return t.p1;
  let k = t.p2;
  if (personen > 2) k += (personen - 2) * t.jeWeiterePerson;
  return k;
}
function calcFinance() {
  const d = state.data;
  const einkommen =
    d.lohn1 + d.lohn2 + d.gewinn1 + d.gewinn2 + d.rente1 + d.rente2 + d.sonst1 + d.sonst2;
  const kindergeld = Math.max(0, d.kinder|0) * KOND.kindergeld;
  const mietenNormal = d.mieten.reduce((s, m) => s + m.wert * KOND.mietansatz, 0);
  const teilvMiete = d.usage === 'mixed' ? (d.teilvermietungMiete || 0) : 0;
  const mieten = mietenNormal + teilvMiete * KOND.mietansatz;
  // "mieteVorhanden" triggert die erhöhte Pauschale — Teilvermietung zählt hier bewusst NICHT
  const mieteVorhanden = d.mieten.some(m => m.wert > 0);
  const gesEinnahmen = einkommen + kindergeld + mieten;

  const personen = haushaltGroesse();
  // Nur reine Kapitalanlage triggert die erhöhte Pauschale; Teilvermietung nicht.
  const kapitalanlage = d.usage === 'invest';
  const mitMietePauschale = mieteVorhanden || kapitalanlage;
  const pauschale = pauschaleFor(personen, mitMietePauschale);

  let ausgaben = d.mieteKalt + pauschale + d.pkv + d.sonstAusgabe;
  d.wuesten.forEach(w => { ausgaben += Math.max(w.rate, w.rest * KOND.darlehensAnsatz.wuestenrot / 12); });
  d.fremd.forEach(f => { ausgaben += Math.max(f.rate, f.rest * KOND.darlehensAnsatz.fremd / 12); });
  d.kredite.forEach(k => { ausgaben += k.rate; });
  d.unterhalt.forEach(u => { ausgaben += u.rate; });

  const spielraum = Math.max(0, gesEinnahmen - ausgaben);
  const szen = {
    komfort:    { rate: spielraum * 0.70, hauspreis: (spielraum*0.70)*12/KOND.annuitaetKapitalisierung },
    ausgewogen: { rate: spielraum * 0.85, hauspreis: (spielraum*0.85)*12/KOND.annuitaetKapitalisierung },
    obergrenze: { rate: spielraum,        hauspreis:  spielraum*12/KOND.annuitaetKapitalisierung },
  };
  return { einkommen, kindergeld, mieten, gesEinnahmen, ausgaben, pauschale, personen, mieteVorhanden, mitMietePauschale, kapitalanlage, spielraum, szen };
}

/* ============================================================
   RAIL
   ============================================================ */
function updateRail() {
  const stepsEl = $('#steps');
  stepsEl.innerHTML = STEPS.map((s, i) => `
    <div class="step-item ${i === state.step ? 'active' : ''} ${i < state.step ? 'done' : ''}" data-step="${i}">
      <div class="step-num">${i < state.step ? '✓' : i + 1}</div>
      <div>${s.title}</div>
    </div>
  `).join('');
  stepsEl.querySelectorAll('.step-item').forEach(el => {
    el.addEventListener('click', () => {
      const i = parseInt(el.dataset.step);
      if (i <= state.step + 1) goStep(i);
    });
  });
  renderLiveSummary();
}
function renderLiveSummary() {
  const d = state.data;
  const f = calcFinance();
  const rows = [];
  if (f.gesEinnahmen > 0) {
    rows.push({ k: 'Einnahmen', v: fmtEUR(f.gesEinnahmen) });
    rows.push({ k: 'Ausgaben', v: fmtEUR(f.ausgaben) });
    rows.push({ k: 'Spielraum', v: fmtEUR(f.spielraum), hero: true });
  } else {
    rows.push({ k: 'Spielraum', v: '— noch offen', empty: true });
  }
  if (d.usage) { rows.push({ divider: true }); rows.push({ k: 'Nutzung', v: { self:'Selbstnutzung', invest:'Kapitalanlage', mixed:'Teilvermietung' }[d.usage] }); }
  if (state.step >= 2) {
    rows.push({ divider: true });
    rows.push({ k: 'Kaufpreis', v: fmtEUR(d.propertyPrice) });
    const loan = Math.max(0, d.propertyPrice + d.extraCosts + (d.renoCosts||0) - d.equity);
    rows.push({ k: 'Darlehen', v: fmtEUR(loan) });
  }
  if (state.step >= 3 && (d.wishRate > 0 || d.maxRate > 0)) {
    rows.push({ divider: true });
    if (d.wishRate > 0) rows.push({ k: 'Wunschrate', v: fmtEUR(d.wishRate) });
    if (d.maxRate > 0)  rows.push({ k: 'Max. Rate', v: fmtEUR(d.maxRate) });
  }
  $('#liveSummary').innerHTML = rows.map(r => r.divider
    ? `<div class="ls-divider"></div>`
    : `<div class="ls-row"><span class="k">${r.k}</span><span class="v ${r.empty?'empty':''} ${r.hero?'hero':''}">${r.v}</span></div>`
  ).join('');
}

/* ============================================================
   RENDER
   ============================================================ */
function renderStage() {
  const v = STEPS[state.step].id;
  const stage = $('#stage');
  const pct = ((state.step) / (STEPS.length - 1)) * 100;
  stage.innerHTML = `<div class="progress-mini"><div class="progress-mini-fill" style="width:${pct}%"></div></div>` + views[v]();
  wireStep(v);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
const views = {};

/* --- 0 INTRO --- */
views.intro = () => `

    <div class="step-hd">Willkommen</div>
    <h1 class="step-title">Wir bauen Ihre Finanzierung — Schritt für Schritt, sichtbar.</h1>
    <p class="step-lede">Fünf kurze Stationen. Sie geben mir Ihre Zahlen, Wünsche und Präferenzen — daraus baue ich Ihr passendes Finanzierungskonzept.</p>

    <div class="card">
      <h3>So läuft es ab</h3>
      <p class="hint">Drei Blöcke — mit klarem Ziel.</p>
      <div class="grid-3">
        <div style="padding:16px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--bg)">

          <b style="font-family:var(--serif);font-size:16px">Objekt und Rahmen</b>

        </div>

          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--brick);font-weight:700">Zum Schluss</div>

/* --- 1 PERSON / HAUSHALTSRECHNUNG --- */

        <div class="val" id="spielraumVal" data-raw="0">${fmtEUR(0)}</div>
        <div class="sub">für Zins, Tilgung und Nebenkosten</div>
      </div>

      <div class="scen-grid">
        <div class="scen-card k">
          <div class="lbl">Komfortabel</div>
          <div class="price" id="scenKPrice">${fmtEUR(0)}</div>
          <div class="rate">Immobilie · bei <span id="scenKRate">${fmtEUR(0)}</span>/Mon.</div>
        </div>
        <div class="scen-card a">
          <div class="lbl">Ausgewogen</div>
          <div class="price" id="scenAPrice">${fmtEUR(0)}</div>
          <div class="rate">Immobilie · bei <span id="scenARate">${fmtEUR(0)}</span>/Mon.</div>
        </div>
        <div class="scen-card o">
          <div class="lbl">Obergrenze</div>
          <div class="price" id="scenOPrice">${fmtEUR(0)}</div>
          <div class="rate">Immobilie · bei <span id="scenORate">${fmtEUR(0)}</span>/Mon.</div>
        </div>

/* --- 3 OBJECT --- */

        <div class="nk-lbl">

          <div class="nk-s">${sublabel}</div>

        <div class="input-suffix nk-pct"><input class="input" type="number" data-nkpct="${key}" value="${item.pct}" step="0.1" min="0" max="20" ${item.on?'':'disabled'}><span class="suf">%</span></div>

    <div class="card">

        <h4 style="font-family:var(--serif);font-size:14px;margin:20px 0 8px">Modernisierungen</h4>

    <div class="card">
      <h3>Kaufnebenkosten <span style="font-size:11px;color:var(--ink-mute);font-weight:400;letter-spacing:.1em;text-transform:uppercase;font-family:var(--sans)">Basiswerte NRW</span></h3>
      <p class="hint">Jede Position an- oder abschalten. Prozentsätze bei Bedarf überschreiben.</p>

        ${nkRow('nkGrESt',  'Grunderwerbsteuer', 'NRW: 6,5 % (Bundesland-abhängig)')}
        ${nkRow('nkNotar',  'Notar &amp; Grundbuch', 'Beurkundung + Eintragung')}

      <div class="nk-sum">
        <span class="l">Summe Kaufnebenkosten</span>
        <span class="r">
          <span class="nk-sum-pct" id="nkSumPct">0,0 %</span>
          <span class="nk-sum-eur" id="nkSumEur">${fmtEUR(0)}</span>
        </span>
      </div>
    </div>

    <div class="card">
      <h3>Wie viel bringen Sie mit?</h3>
      <p class="hint">Erspartes, Bausparen, Schenkung, verfügbare Anlagen. Über 100.000 € tippen Sie einfach direkt ins Feld — der Regler geht bis 100 T€.</p>

        <div class="dual-slider">
          <input type="range" id="eq" min="0" max="100000" step="1000" value="${Math.min(100000, d.equity)}">

/* --- 4 RATES --- */
views.rates = () => {
  const d = state.data;
  const f = calcFinance();
  // Vorbelegung, falls Kunde die Rate noch nicht angefasst hat
  if (!d.wishRateTouched && f.spielraum > 0) d.wishRate = Math.round(f.szen.komfort.rate);
  if (!d.maxRateTouched && f.spielraum > 0) d.maxRate = Math.round(f.szen.obergrenze.rate);
  return `
  <div class="step-view active">
    <div class="step-hd">Station 3 von 5</div>
    <h1 class="step-title">Was zahlen Sie <em>gern</em> — und was schmerzt <em>nicht</em>?</h1>

    ${f.spielraum > 0 ? `
    <div class="callout" style="border-left-color:var(--sage);background:linear-gradient(180deg, rgba(109,145,85,.08), rgba(109,145,85,.03));margin-bottom:24px">
      Aus Ihrer Situation: komfortabel <b>${fmtEUR(f.szen.komfort.rate)}</b> · ausgewogen <b>${fmtEUR(f.szen.ausgewogen.rate)}</b> · Obergrenze <b>${fmtEUR(f.szen.obergrenze.rate)}</b>.

      </div>

      <div class="slider-block" style="margin-top:28px">
        <div class="slider-hd">
          <span class="slider-label">Maximale Rate — <span style="color:var(--ink-mute);font-family:var(--sans);font-size:12px">wenn der Rest perfekt passt</span></span>
          <span class="serif-val-wrap"><input class="serif-input" type="number" id="mr" value="${d.maxRate}" step="50" min="0"><span class="serif-suf">€</span></span>

/* --- PREF (Präferenzen: Sondertilg-Prio, Flex, Förderung) --- */
views.pref = () => {
  const d = state.data;
  const antragsteller = d.person2 ? 2 : 1;
  const kinder = Math.max(0, d.kinder|0);
  const zulJahr = KOND.wohnfoerderung.antragsteller * antragsteller + KOND.wohnfoerderung.kind * kinder;
  const zulMonat = zulJahr / 12;
  const prios = [
    { k: 'wichtig', t: 'Wichtig',          s: 'Sie behalten volle Flexibilität: Bonus, Steuererstattung oder Erbe fließen direkt in die Tilgung — das spart spürbar Zinsen und verkürzt die Laufzeit.' },
    { k: 'nett',    t: 'Nett zu haben',    s: 'Wenn die Bank es ohne Zinsaufschlag mitgibt, nehmen wir es gern mit — ein kostenloser Puffer für außerplanmäßige Zahlungen.' },
    { k: 'nicht',   t: 'Nicht so wichtig', s: 'Kein Muss. Wir konzentrieren uns auf den besten Zins; kleine Extra-Tilgungen sind für Sie kein Thema.' },
    { k: 'egal',    t: 'Egal',             s: 'Sie planen keine außerplanmäßigen Zahlungen — dafür sichern wir Ihnen den bestmöglichen Basiszins.' },
  ];
  return `
  <div class="step-view active">
    <div class="step-hd">Station 4 von 5</div>
    <h1 class="step-title">Präferenzen &amp; Förderung.</h1>
    <p class="step-lede">Ein paar Angaben zu Ihrer Wunsch-Flexibilität und den Fördermöglichkeiten. Das Konzept baue ich Ihnen daraus zusammen.</p>

    <div class="card">
      <h3>Sondertilgungsrecht — wie wichtig?</h3>
      <p class="hint">Das Recht, jährlich außerplanmäßig zu tilgen (z. B. bei Bonus, Steuererstattung, Erbe). Bis 5 % pro Jahr sind meist kostenlos möglich.</p>
      <div class="choices" id="prioChoices">
        ${prios.map(p => `
          <button class="choice ${d.sondertilgungPrio===p.k?'selected':''}" data-prio="${p.k}">
            <span class="choice-title">${p.t}</span>
            <span class="choice-sub">${p.s}</span>
          </button>`).join('')}
      </div>
    </div>

    <div class="card">
      <h3>Tilgungssatzwechsel</h3>
      <p class="hint">Das Recht, die Tilgung während der Laufzeit 2–3× anzupassen — meist zwischen 1 % und 5 %.</p>
      <label class="switch">
        <input type="checkbox" id="raSwitch" ${d.ratenanpassung?'checked':''}>
        <div class="switch-track"><div class="switch-thumb"></div></div>
        <span style="font-weight:600">Tilgungssatzwechsel vereinbaren</span>
      </label>
      <div class="grid-3" style="margin-top:18px">
        <div style="padding:14px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--bg)"><b>Elternzeit / Teilzeit</b><div style="font-size:12px;color:var(--ink-soft);margin-top:4px">Tilgung runter, später wieder rauf.</div></div>
        <div style="padding:14px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--bg)"><b>Gehaltssprung</b><div style="font-size:12px;color:var(--ink-soft);margin-top:4px">Höhere Tilgung — schneller schuldenfrei.</div></div>
        <div style="padding:14px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--bg)"><b>Größere Zahlung</b><div style="font-size:12px;color:var(--ink-soft);margin-top:4px">Sondertilgung nutzen.</div></div>
      </div>
    </div>

    <div class="card">
      <h3>Neue Wohnförderung <span style="font-size:11px;color:var(--ink-mute);font-weight:400;letter-spacing:.1em;text-transform:uppercase;font-family:var(--sans)">ab 2027</span></h3>
      <p class="hint">Staatliche Zulage — direkt aus Ihrer Haushaltsangabe ermittelt. Muss aktiv beantragt werden.</p>
      <div class="premie-box ${d.wohnfoerderungOptIn?'':'dim'}" style="margin-top:6px">
        <div class="pr-hd">Ihre voraussichtliche Zulage</div>
        <div class="pr-body">${fmtEUR(zulJahr)} / Jahr <span style="font-size:14px;color:var(--ink-mute);font-weight:400">· ${fmtEUR(zulMonat)} / Monat</span></div>
        <div class="pr-note"><b>${antragsteller} Antragsteller</b> × ${fmtEUR(KOND.wohnfoerderung.antragsteller)} + <b>${kinder} Kind${kinder===1?'':'er'}</b> × ${fmtEUR(KOND.wohnfoerderung.kind)} pro Jahr.</div>
      </div>
      <label class="switch" style="margin-top:14px">
        <input type="checkbox" id="wfSwitch" ${d.wohnfoerderungOptIn?'checked':''}>
        <div class="switch-track"><div class="switch-thumb"></div></div>
        <span style="font-weight:600">Ja, bitte beantragen</span>
      </label>
    </div>

    <div class="card">
      <h3>Weitere Förderprogramme</h3>
      <p class="hint">Können wir zusätzlich zu Ihrem Konzept prüfen.</p>
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:6px">
        <label class="switch" style="justify-content:space-between;width:100%;align-items:flex-start">
          <span style="flex:1">
            <b>KfW-Programme</b>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:4px">Zinsgünstige Kredite für Neubau (KfW 297/298), Sanierung (KfW 261), klimafreundliches Wohnen — bis 150 T€ zu vergünstigten Konditionen.</div>
          </span>
          <input type="checkbox" id="kfw" ${d.kfw?'checked':''}>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </label>
        <label class="switch" style="justify-content:space-between;width:100%;align-items:flex-start">
          <span style="flex:1">
            <b>Regionale / kommunale Programme</b>
            <div style="font-size:12px;color:var(--ink-soft);margin-top:4px">Landesförderung für Familien, Zuschüsse bei Sanierung, verbilligte Grundstücke im ländlichen Raum.</div>
          </span>
          <input type="checkbox" id="reg" ${d.regional?'checked':''}>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </label>
      </div>
    </div>

    ${navRow(true, true)}
  </div>
  `;
};

/* --- 5 SUMMARY --- */

  const d = state.data;
  const f = calcFinance();
  const total = d.propertyPrice + d.extraCosts;
  const loan = Math.max(0, total - d.equity);
  const antragsteller = d.person2 ? 2 : 1;
  const zulJahr = KOND.wohnfoerderung.antragsteller * antragsteller + KOND.wohnfoerderung.kind * (d.kinder|0);
  const usageLbl = { self:'Selbstnutzung', invest:'Kapitalanlage', mixed:'Teilvermietung' }[d.usage] || '–';
  const prioLbl = { wichtig:'Wichtig', nett:'Nett zu haben', nicht:'Nicht so wichtig', egal:'Egal' }[d.sondertilgungPrio] || '–';
  return `
  <div class="step-view active">

/* ============================================================
   OBJEKTDATEN-HELPER
   ============================================================ */
function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function objTypLabel(t) { return { efh:'Einfamilienhaus', zfh:'Zweifamilienhaus', ewg:'Eigentumswohnung' }[t] || '—'; }
function objKellerLabel(k) { return { voll:'Vollunterkellert', teil:'Teilunterkellert', ohne:'Ohne Keller' }[k] || '—'; }
function objSummaryItems(o) {
  const items = [];
  items.push(['Objektart', objTypLabel(o.typ)]);
  const addr = [o.strasse, o.hausnr].filter(Boolean).join(' ');
  const orte = [o.plz, o.ort].filter(Boolean).join(' ');
  const full = [addr, orte].filter(Boolean).join(', ');
  if (full) items.push(['Adresse', escapeHtml(full)]);
  if (o.typ === 'zfh') {
    if (o.wohnflaeche)  items.push(['Wohnfläche 1', o.wohnflaeche + ' m²']);
    if (o.wohnflaeche2) items.push(['Wohnfläche 2', o.wohnflaeche2 + ' m²']);
  } else if (o.wohnflaeche) {
    items.push(['Wohnfläche', o.wohnflaeche + ' m²']);
  }
  if (o.typ !== 'ewg' && o.grundstueck) items.push(['Grundstück', o.grundstueck + ' m²']);
  if (o.baujahr)  items.push(['Baujahr', o.baujahr]);
  if (o.bauart)   items.push(['Bauart', escapeHtml(o.bauart)]);
  if (o.typ !== 'ewg') {
    if (o.vollgeschosse) items.push(['Vollgeschosse', o.vollgeschosse]);
    items.push(['Dachgeschoss', o.dgAusgebaut ? 'ausgebaut' : 'nicht ausgebaut']);
    if (o.keller) items.push(['Keller', objKellerLabel(o.keller)]);
  } else {
    if (o.etage)              items.push(['Etage', escapeHtml(o.etage)]);
    if (o.einheitenGebaeude)  items.push(['Whg. im Gebäude', o.einheitenGebaeude]);
  }
  return items;
}

/* ============================================================
   DRUCK-DOKUMENT (Berater-Ansicht, nur im Print sichtbar)

function printDoc() {
  const d = state.data;
  const f = calcFinance();
  const total = d.propertyPrice + d.extraCosts;
  const loan = Math.max(0, total - d.equity);
  const ltv = d.propertyPrice > 0 ? (loan / d.propertyPrice) * 100 : 0;
  const eqQuote = total > 0 ? (d.equity / total) * 100 : 0;
  const antragsteller = d.person2 ? 2 : 1;
  const kinder = Math.max(0, d.kinder|0);
  const zulJahr = KOND.wohnfoerderung.antragsteller * antragsteller + KOND.wohnfoerderung.kind * kinder;
  const usageLbl = { self:'Selbstnutzung', invest:'Kapitalanlage', mixed:'Teilvermietung' }[d.usage] || '—';
  const prioLbl = { wichtig:'wichtig', nett:'nett zu haben', nicht:'nicht so wichtig', egal:'egal' }[d.sondertilgungPrio] || '—';
  const today = new Date().toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' });

  const kv = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;

  // Einnahmen-Tabelle
  const einRows = [
    ['Lohn / Gehalt', d.lohn1, d.lohn2],
    ['Selbstständig (Gewinn)', d.gewinn1, d.gewinn2],
    ['Rente / Pension', d.rente1, d.rente2],
    ['Sonstige Einnahmen', d.sonst1, d.sonst2],
  ].filter(r => r[1] > 0 || (d.person2 && r[2] > 0));
  const sumP1 = d.lohn1 + d.gewinn1 + d.rente1 + d.sonst1;
  const sumP2 = d.lohn2 + d.gewinn2 + d.rente2 + d.sonst2;

  const einTbl = `
    <table class="pd-tbl">
      <thead><tr>
        <th>Position</th>

        ${d.person2 ? '<th class="num">Person 2</th>' : ''}
        <th class="num">Summe</th>
      </tr></thead>
      <tbody>
        ${einRows.map(r => `<tr>
          <td>${r[0]}</td>
          <td class="num">${fmtEUR(r[1])}</td>
          ${d.person2 ? `<td class="num">${fmtEUR(r[2])}</td>` : ''}
          <td class="num">${fmtEUR(r[1] + (d.person2 ? r[2] : 0))}</td>
        </tr>`).join('') || `<tr><td colspan="${d.person2?4:3}" style="color:#666">— keine Einnahmen eingetragen —</td></tr>`}
        ${kinder > 0 ? `<tr>
          <td>Kindergeld (${kinder} × ${fmtEUR(KOND.kindergeld)})</td>
          <td class="num">—</td>
          ${d.person2 ? '<td class="num">—</td>' : ''}
          <td class="num">${fmtEUR(kinder * KOND.kindergeld)}</td>
        </tr>` : ''}
        ${d.mieten.filter(m => m.wert > 0).map((m, i) => `<tr>
          <td>Mieteinnahme ${i+1} (${fmtEUR(m.wert)} · 80 %)</td>
          <td class="num">—</td>
          ${d.person2 ? '<td class="num">—</td>' : ''}
          <td class="num">${fmtEUR(m.wert * KOND.mietansatz)}</td>
        </tr>`).join('')}
        ${d.usage === 'mixed' && d.teilvermietungMiete > 0 ? `<tr>
          <td>Teilvermietung (${fmtEUR(d.teilvermietungMiete)} · 80 %)</td>
          <td class="num">—</td>
          ${d.person2 ? '<td class="num">—</td>' : ''}
          <td class="num">${fmtEUR(d.teilvermietungMiete * KOND.mietansatz)}</td>
        </tr>` : ''}
      </tbody>
      <tfoot><tr>
        <td>Summe Einnahmen</td>
        <td class="num">${fmtEUR(sumP1)}</td>
        ${d.person2 ? `<td class="num">${fmtEUR(sumP2)}</td>` : ''}
        <td class="num">${fmtEUR(f.gesEinnahmen)}</td>
      </tr></tfoot>
    </table>
  `;

  // Ausgaben-Tabelle
  const ausRows = [];
  if (d.mieteKalt > 0)     ausRows.push(['Kaltmiete (aktuell)', d.mieteKalt, '']);
  ausRows.push([`Haushaltspauschale (${f.personen} Pers.${f.mitMietePauschale?', mit Miete/KA':', ohne Miete'})`, f.pauschale, '']);
  if (d.pkv > 0)           ausRows.push(['Private Krankenversicherung', d.pkv, '']);
  if (d.sonstAusgabe > 0)  ausRows.push(['Sonstige feste Ausgaben', d.sonstAusgabe, '']);
  d.wuesten.forEach((w, i) => {
    const ang = Math.max(w.rate, w.rest * KOND.darlehensAnsatz.wuestenrot / 12);
    ausRows.push([`Bauspardarlehen ${i+1}`, ang, `Rate ${fmtEUR(w.rate)} · Rest ${fmtEUR(w.rest)} · Ansatz 6 %`]);
  });
  d.fremd.forEach((k, i) => {
    const ang = Math.max(k.rate, k.rest * KOND.darlehensAnsatz.fremd / 12);
    ausRows.push([`Fremddarlehen ${i+1}`, ang, `Rate ${fmtEUR(k.rate)} · Rest ${fmtEUR(k.rest)} · Ansatz 9 %`]);
  });
  d.kredite.forEach((k, i)   => ausRows.push([`Kredit / Ratenzahlung ${i+1}`, k.rate, '']));
  d.unterhalt.forEach((u, i) => ausRows.push([`Unterhalt ${i+1}`, u.rate, '']));

  const ausTbl = `
    <table class="pd-tbl">
      <thead><tr>
        <th>Position</th>
        <th class="num">Ansatz / Mon.</th>
        <th>Detail</th>
      </tr></thead>
      <tbody>
        ${ausRows.map(r => `<tr>
          <td>${r[0]}</td>
          <td class="num">${fmtEUR(r[1])}</td>
          <td style="color:#555;font-size:8.5pt">${r[2] || ''}</td>
        </tr>`).join('')}
      </tbody>
      <tfoot><tr>
        <td>Summe Ausgaben</td>
        <td class="num">${fmtEUR(f.ausgaben)}</td>
        <td></td>

  `;

  // Nebenkosten-Aufschlüsselung
  const nkParts = [
    ['nkGrESt',  'Grunderwerbsteuer'],
    ['nkNotar',  'Notar & Grundbuch'],
    ['nkMakler', 'Maklerprovision'],
  ].map(([k, lbl]) => {
    const it = d[k];
    if (!it.on) return `<div class="kv"><span class="k">${lbl}</span><span class="v">—</span></div>`;
    const eur = d.propertyPrice * it.pct / 100;
    return `<div class="kv"><span class="k">${lbl} (${it.pct.toString().replace('.',',')} %)</span><span class="v">${fmtEUR(eur)}</span></div>`;
  }).join('');

  // Muss-Kriterien
  const criteria = d.criteria.filter(c => c.text.trim());
  const critHtml = criteria.length
    ? criteria.map(c => `<div class="cr ${c.done?'done':''}"><span class="box">${c.done?'✓':''}</span><span class="txt">${c.text.replace(/[<>]/g, s => s==='<'?'&lt;':'&gt;')}</span></div>`).join('')
    : `<div style="color:#666">— keine Kriterien eingetragen —</div>`;

  return `
  <div class="print-doc">
    <div class="pd-head">
      <div class="pd-t">Immobilienfinanzierung — Beratungsnotiz</div>
      <div class="pd-meta">Datum: <b>${today}</b></div>
    </div>

    <div class="pd-key">
      <div class="kf">
        <span class="kf-lbl">Nutzung</span>
        <span class="kf-val">${usageLbl}</span>
        <span class="kf-sub">${antragsteller} Antragst. · ${kinder} Kind${kinder===1?'':'er'}</span>
      </div>
      <div class="kf">
        <span class="kf-lbl">Kaufpreis</span>
        <span class="kf-val">${fmtEUR(d.propertyPrice)}</span>
        <span class="kf-sub">+ NK ${fmtEUR(d.extraCosts)}${(d.renoCosts||0)>0 ? ' + Reno ' + fmtEUR(d.renoCosts) : ''}</span>
      </div>
      <div class="kf">
        <span class="kf-lbl">Darlehen</span>
        <span class="kf-val">${fmtEUR(loan)}</span>
        <span class="kf-sub">EK ${fmtEUR(d.equity)}</span>
      </div>
      <div class="kf">
        <span class="kf-lbl">Rate / Monat</span>
        <span class="kf-val">${fmtEUR(d.wishRate)}</span>
        <span class="kf-sub">max. ${fmtEUR(d.maxRate)}</span>
      </div>
    </div>

    ${d.hasObject ? `
    <div class="pd-sec pd-obj">
      <h2>Objektdaten</h2>
      <div class="pd-kv cols-3">
        ${objSummaryItems(d.obj).map(([k, v]) => kv(k, v)).join('')}
      </div>
      ${(d.obj.modVergangen || d.obj.modGeplant) ? `
      <div class="pd-mod">
        ${d.obj.modVergangen ? `<div><div class="pd-mod-lbl">Modernisierungen bereits</div><div class="pd-mod-txt">${escapeHtml(d.obj.modVergangen)}</div></div>` : ''}
        ${d.obj.modGeplant   ? `<div><div class="pd-mod-lbl">Modernisierungen geplant</div><div class="pd-mod-txt">${escapeHtml(d.obj.modGeplant)}</div></div>` : ''}
      </div>` : ''}
    </div>` : ''}

    <div class="pd-body">
      <div>
        <div class="pd-col-hd">Situation des Kunden</div>

        <div class="pd-sec">
          <h2>Einnahmen · monatlich netto</h2>
          ${einTbl}
        </div>

        <div class="pd-sec">
          <h2>Ausgaben &amp; Verpflichtungen · monatlich</h2>
          ${ausTbl}
        </div>
      </div>

      <div>
        <div class="pd-col-hd">Finanzierungs-Rahmen</div>

        <div class="pd-sec">
          <h2>Objekt &amp; Nebenkosten</h2>
          <div class="pd-kv">
            ${kv('Kaufpreis', fmtEUR(d.propertyPrice))}
            ${nkParts}
            ${kv('Summe Nebenkosten', fmtEUR(d.extraCosts))}
            ${(d.renoCosts||0) > 0 ? kv('Geplante Renovierung', fmtEUR(d.renoCosts)) : ''}
            ${kv('Gesamtaufwand', fmtEUR(total))}
          </div>
        </div>

        <div class="pd-sec">
          <h2>Eigenkapital &amp; Darlehen</h2>
          <div class="pd-kv">
            ${kv('Eigenkapital', fmtEUR(d.equity))}
            ${kv('Benötigtes Darlehen', fmtEUR(loan))}

        </div>

        <div class="pd-sec">
          <h2>Rate &amp; Präferenzen</h2>
          <div class="pd-kv">
            ${kv('Wunschrate', fmtEUR(d.wishRate) + ' / Mon.')}
            ${kv('Maximalrate', fmtEUR(d.maxRate) + ' / Mon.')}
            ${kv('Sondertilgung', prioLbl)}
            ${kv('Tilgungssatzwechsel', d.ratenanpassung ? 'ja' : 'nein')}

        </div>

        <div class="pd-sec">
          <h2>Förderung</h2>
          <div class="pd-kv">

    <div class="pd-sec">

    </div>

    <div class="pd-foot">

    </div>
  </div>
  `;
}


function navRow(back, forward) {
  return `<div class="nav-row">
    <button class="btn btn-ghost" id="back" ${back?'':'disabled'}>← Zurück</button>
    <button class="btn btn-primary" id="next" ${forward?'':'disabled'}>Weiter →</button>
  </div>`;
}

/* ============================================================
   WIRING
   ============================================================ */
function wireStep(id) {
  const back = $('#back'), next = $('#next');
  if (back) back.addEventListener('click', () => goStep(state.step - 1));
  if (next) next.addEventListener('click', () => goStep(state.step + 1));
  if (views['wire_' + id]) views['wire_' + id]();
  updateRail();
}
function goStep(i) { if (i < 0 || i >= STEPS.length) return; state.step = i; renderStage(); }

function bindNum(id, key, cb) {
  const el = document.getElementById(id); if (!el) return;
  el.addEventListener('input', () => { state.data[key] = numFrom(el.value); if (cb) cb(); renderLiveSummary(); });
}
function bindSlider(id, key, cb, labelEl) {
  const el = document.getElementById(id); if (!el) return;
  el.addEventListener('input', () => { state.data[key] = parseFloat(el.value); if (cb) cb(); if (labelEl) pulseEl(document.getElementById(labelEl)); renderLiveSummary(); });
}

/* --- PERSON --- */
views.wire_person = () => {
  const d = state.data;
  const catChips = document.getElementById('catChips');
  const catSections = document.getElementById('catSections');

  const keyOf = cat => cat === 'miete' ? 'mieten' : cat === 'kredit' ? 'kredite' : cat;
  const newItem = cat => cat === 'miete' ? { id: uid(), wert: 0 }
                     : (cat === 'wuesten' || cat === 'fremd') ? { id: uid(), rate: 0, rest: 0 }
                     : { id: uid(), rate: 0 };

  function sectionForCat(cat) {
    const meta = {
      wuesten:   { title: 'Bauspardarlehen', tag: 'Rate oder Restschuld × 6 %/12 (der höhere Wert zählt)' },
      fremd:     { title: 'Fremddarlehen',   tag: 'Rate oder Restschuld × 9 %/12 (der höhere Wert zählt)' },
      kredit:    { title: 'Kredite & Ratenzahlungen', tag: 'monatliche Rate' },
      unterhalt: { title: 'Unterhalt', tag: 'monatlicher Betrag' },
    }[cat];
    const addLabel = { wuesten: 'Bauspardarlehen', fremd: 'Fremddarlehen', kredit: 'Kredit', unterhalt: 'Unterhalt' }[cat];
    return `<div class="cat-section" data-sec="${cat}">
      <h4>${meta.title}<span class="tag">${meta.tag}</span></h4>
      <div class="row-list" id="list-${cat}"></div>
      <button class="row-add" type="button" data-add="${cat}">+ Weiteres ${addLabel} hinzufügen</button>
    </div>`;
  }

  function rowHTML(cat, it) {
    if (cat === 'miete') {
      return `<div class="row-item one" data-id="${it.id}" data-type="miete">
        <div class="field"><label>Kaltmiete / Monat</label><div class="input-suffix"><input class="input" type="number" data-k="wert" value="${it.wert||''}" placeholder="0" step="10"><span class="suf">€</span></div></div>
        <button class="del" title="Entfernen">✕</button>
        <div class="rowinfo">Angesetzt (80 %): <b>${fmtEUR((it.wert||0)*0.8)}</b></div>
      </div>`;
    }
    if (cat === 'wuesten' || cat === 'fremd') {
      const ansatzPct = cat === 'wuesten' ? KOND.darlehensAnsatz.wuestenrot : KOND.darlehensAnsatz.fremd;
      const ang = Math.max(it.rate||0, (it.rest||0) * ansatzPct / 12);
      return `<div class="row-item" data-id="${it.id}" data-type="${cat}">
        <div class="field"><label>Rate / Monat</label><div class="input-suffix"><input class="input" type="number" data-k="rate" value="${it.rate||''}" placeholder="0" step="10"><span class="suf">€</span></div></div>
        <div class="field"><label>Restschuld</label><div class="input-suffix"><input class="input" type="number" data-k="rest" value="${it.rest||''}" placeholder="0" step="1000"><span class="suf">€</span></div></div>
        <button class="del" title="Entfernen">✕</button>
        <div class="rowinfo">Angesetzt: <b>${fmtEUR(ang)}</b></div>
      </div>`;
    }
    return `<div class="row-item one" data-id="${it.id}" data-type="${cat}">
      <div class="field"><label>${cat==='kredit'?'Rate':'Betrag'} / Monat</label><div class="input-suffix"><input class="input" type="number" data-k="rate" value="${it.rate||''}" placeholder="0" step="10"><span class="suf">€</span></div></div>
      <button class="del" title="Entfernen">✕</button>
    </div>`;
  }

  function wireRowInputs() {
    // Direkt nach Render aufrufen — jedes .row-item bekommt genau einmal Listener.
    document.querySelectorAll('.row-item input[data-k]').forEach(inp => {
      inp.addEventListener('input', () => {
        const row = inp.closest('.row-item');
        const it = d[keyOf(row.dataset.type)].find(x => x.id === row.dataset.id);
        if (it) { it[inp.dataset.k] = numFrom(inp.value); refresh(); }
      });
    });
    document.querySelectorAll('.row-item .del').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.row-item');
        deleteItem(row.dataset.type, row.dataset.id);
      });
    });
  }

  function wireRowAddButtons() {
    document.querySelectorAll('.row-add[data-add]').forEach(btn => {
      // Vermeide Doppel-Wiring durch data-Flag
      if (btn.dataset.wired) return;
      btn.dataset.wired = '1';
      btn.addEventListener('click', () => addItem(btn.dataset.add));
    });
  }

  function renderCatSections() {
    catSections.innerHTML = Array.from(d.activeCats).map(sectionForCat).join('');
    renderAllRows();
    wireRowAddButtons();
  }

  function renderAllRows() {
    const mList = document.getElementById('mietList');
    if (mList) mList.innerHTML = d.mieten.map(m => rowHTML('miete', m)).join('');
    ['wuesten','fremd','kredit','unterhalt'].forEach(cat => {
      const listEl = document.getElementById('list-' + cat);
      if (!listEl) return;
      listEl.innerHTML = d[keyOf(cat)].map(it => rowHTML(cat, it)).join('');
    });
    wireRowInputs();
  }

  function addItem(cat) {
    d[keyOf(cat)].push(newItem(cat));
    renderAllRows();
    refresh();
  }

  function deleteItem(cat, id) {
    d[keyOf(cat)] = d[keyOf(cat)].filter(x => x.id !== id);
    renderAllRows();
    refresh();
  }

  function updateRowInfos() {
    // Miet-Zeilen
    document.querySelectorAll('#mietList .row-item').forEach(row => {
      const it = d.mieten.find(x => x.id === row.dataset.id);
      if (!it) return;
      const b = row.querySelector('.rowinfo b');
      if (b) b.textContent = fmtEUR((it.wert||0) * KOND.mietansatz);
    });
    // Wüsten/Fremd — Ansatz-Wert
    ['wuesten','fremd'].forEach(cat => {
      const pct = cat === 'wuesten' ? KOND.darlehensAnsatz.wuestenrot : KOND.darlehensAnsatz.fremd;
      document.querySelectorAll(`.row-item[data-type="${cat}"]`).forEach(row => {
        const it = d[cat].find(x => x.id === row.dataset.id);
        if (!it) return;
        const ang = Math.max(it.rate||0, (it.rest||0) * pct / 12);
        const b = row.querySelector('.rowinfo b');
        if (b) b.textContent = fmtEUR(ang);
      });
    });
  }

  function refresh() {
    const f = calcFinance();
    document.getElementById('kgVal').textContent = fmtEUR(d.kinder * KOND.kindergeld);
    document.getElementById('pauschale').value = f.pauschale;
    const zusatz = f.mieteVorhanden ? ', mit Miete' : (f.kapitalanlage ? ', Kapitalanlage' : ', ohne Miete');
    document.getElementById('pauschInfo').textContent = `(${f.personen} Pers.${zusatz})`;
    setMetric('sumEin', f.gesEinnahmen);
    setMetric('sumAus', f.ausgaben);
    setMetric('spielraumVal', f.spielraum);
    setMetric('scenKPrice', f.szen.komfort.hauspreis);
    setMetric('scenAPrice', f.szen.ausgewogen.hauspreis);
    setMetric('scenOPrice', f.szen.obergrenze.hauspreis);
    document.getElementById('scenKRate').textContent = fmtEUR(f.szen.komfort.rate);
    document.getElementById('scenARate').textContent = fmtEUR(f.szen.ausgewogen.rate);
    document.getElementById('scenORate').textContent = fmtEUR(f.szen.obergrenze.rate);
    updateRowInfos();
    const teilvAnsatz = document.getElementById('teilvAnsatz');
    if (teilvAnsatz) teilvAnsatz.textContent = fmtEUR((d.teilvermietungMiete||0) * KOND.mietansatz);
    renderLiveSummary();
  }

  // Nutzungsart wählen — beeinflusst Pauschale und Teilvermietungs-Feld
  $$('#usageChoices .choice').forEach(c => c.addEventListener('click', () => {
    d.usage = c.dataset.val;
    $$('#usageChoices .choice').forEach(x => x.classList.toggle('selected', x === c));
    const teilvSec = document.getElementById('teilvSection');
    if (teilvSec) teilvSec.style.display = d.usage === 'mixed' ? 'block' : 'none';
    refresh();
  }));

  // Teilvermietungs-Miete (nur bei usage='mixed' sichtbar)
  const teilvInp = document.getElementById('teilvMiete');
  if (teilvInp) teilvInp.addEventListener('input', () => {
    d.teilvermietungMiete = numFrom(teilvInp.value);
    const b = document.getElementById('teilvAnsatz');
    if (b) b.textContent = fmtEUR(d.teilvermietungMiete * KOND.mietansatz);
    refresh();
  });

  // Person 2 toggle
  document.getElementById('person2').addEventListener('change', e => {
    d.person2 = e.target.checked;
    $$('.p2col').forEach(c => c.classList.toggle('hide', !d.person2));
    ['lohn2','gewinn2','rente2','sonst2'].forEach(id => {
      const el = document.getElementById(id);
      el.disabled = !d.person2;
      if (!d.person2) { el.value = ''; d[id] = 0; }
    });
    refresh();
  });

  // static inputs
  ['lohn1','lohn2','gewinn1','gewinn2','rente1','rente2','sonst1','sonst2','mieteKalt','pkv','sonstAusgabe'].forEach(id => bindNum(id, id, refresh));
  bindNum('kinder', 'kinder', refresh);

  // category chips
  catChips.addEventListener('click', e => {
    const btn = e.target.closest('.cat-chip'); if (!btn) return;
    const cat = btn.dataset.cat;
    if (d.activeCats.has(cat)) {
      d.activeCats.delete(cat);
      const arr = cat === 'miete' ? 'mieten' : cat === 'kredit' ? 'kredite' : cat;
      d[arr] = [];
    } else {
      d.activeCats.add(cat);
      const arr = cat === 'miete' ? 'mieten' : cat === 'kredit' ? 'kredite' : cat;
      if (d[arr].length === 0) {
        d[arr].push(cat === 'miete' ? { id: uid(), wert: 0 }
          : (cat === 'wuesten' || cat === 'fremd') ? { id: uid(), rate: 0, rest: 0 }
          : { id: uid(), rate: 0 });
      }
    }
    btn.classList.toggle('on');
    renderCatSections();
    refresh();
  });

  renderCatSections();
  refresh();
};


/* --- OBJECT --- */
views.wire_object = () => {
  const d = state.data;

  const refreshNkRows = () => {
    ['nkGrESt','nkNotar','nkMakler'].forEach(key => {
      const item = d[key];
      const eur = d.propertyPrice * item.pct / 100;
      const row = document.querySelector(`[data-nk="${key}"]`);
      if (row) row.classList.toggle('off', !item.on);
      const eurEl = document.querySelector(`[data-nkeur="${key}"]`);
      if (eurEl) eurEl.textContent = item.on ? fmtEUR(eur) : '—';
      const pctEl = document.querySelector(`[data-nkpct="${key}"]`);
      if (pctEl) pctEl.disabled = !item.on;
    });
    const info = recomputeExtraCosts();
    $('#nkSumPct').textContent = info.nkPct.toFixed(2).replace('.', ',') + ' %';
    $('#nkSumEur').textContent = fmtEUR(info.extraCosts);
  };

  const refresh = () => {
    refreshNkRows();
    const total = d.propertyPrice + d.extraCosts + (d.renoCosts||0);
    const loan = Math.max(0, total - d.equity);
    const ltv = d.propertyPrice > 0 ? (loan / d.propertyPrice) * 100 : 0;
    setMetric('loanShow', loan);
    setMetric('totalShow', total);
    const brk = document.getElementById('totalBreakdown');
    if (brk) brk.textContent = (d.renoCosts||0) > 0 ? 'Kaufpreis + Nebenkosten + Renovierung' : 'Kaufpreis + Nebenkosten';
    const eqQ = total > 0 ? (d.equity/total)*100 : 0;
    $('#loanRatio').textContent = d.equity > 0 && total > 0
      ? `Eigenkapital deckt ${eqQ.toFixed(0)} % ab`
      : 'Ohne Eigenkapital: Vollfinanzierung';

    // Belohnung nach Beleihungsauslauf
    const rw = document.getElementById('ekReward');
    rw.classList.remove('good','mid','warn');
    $('#rwLtv').textContent = ltv.toFixed(0) + ' %';
    if (ltv < 90) {
      rw.classList.add('good');
      $('#rwIcon').textContent = '🌱';
      $('#rwTitle').textContent = 'Ausgezeichnete Basis';
      $('#rwText').textContent = 'Ihr Beleihungsauslauf liegt unter 90 % — beste Zinskonditionen möglich.';
    } else if (ltv <= 100) {
      rw.classList.add('mid');
      $('#rwIcon').textContent = '⚖️';
      $('#rwTitle').textContent = 'Solide, aber straff';
      $('#rwText').textContent = 'Der Beleihungsauslauf liegt zwischen 90 % und 100 % — Zinsaufschlag im mittleren Bereich. Etwas mehr Eigenkapital lohnt sich spürbar.';
    } else {
      rw.classList.add('warn');
      $('#rwIcon').textContent = '⚠️';
      $('#rwTitle').textContent = 'Nebenkosten werden mitfinanziert';
      $('#rwText').textContent = 'Der Beleihungsauslauf liegt über 100 %. Deutlicher Zinsaufschlag und höheres Risiko — wir sollten hier gemeinsam nachjustieren.';
    }

    const nkOk = d.equity >= d.extraCosts && d.extraCosts > 0;
    $('#eqExplain').innerHTML = `<b>Faustregel:</b> Ihr Eigenkapital sollte <b>mindestens die Nebenkosten</b> decken (${fmtEUR(d.extraCosts)}). Alles darüber senkt Zins und Rate spürbar.${nkOk?' <b style="color:var(--sage)">✓ Sie erfüllen das.</b>':''}`;
    drawPie(d.equity, loan);
    renderLiveSummary();
  };

  // Kaufpreis
  document.getElementById('pp').addEventListener('input', e => {
    d.propertyPrice = numFrom(e.target.value);
    refresh();
  });
  // Renovierungskosten
  const rc = document.getElementById('rc');
  if (rc) rc.addEventListener('input', e => {
    d.renoCosts = numFrom(e.target.value);
    refresh();
  });

  // Konkretes Objekt an/aus
  const hasObj = document.getElementById('hasObjectSwitch');
  if (hasObj) hasObj.addEventListener('change', e => {
    d.hasObject = e.target.checked;
    document.getElementById('objBox').style.display = d.hasObject ? 'block' : 'none';
    renderLiveSummary();
  });

  // Objekttyp — beeinflusst welche Felder sichtbar sind
  const applyObjTypVisibility = () => {
    const isEwg = d.obj.typ === 'ewg';
    const isZfh = d.obj.typ === 'zfh';
    const set = (id, show) => { const el = document.getElementById(id); if (el) el.style.display = show ? 'flex' : 'none'; };
    set('obj-wf2-wrap',    isZfh);
    set('obj-grund-wrap', !isEwg);
    set('obj-vg-wrap',    !isEwg);
    set('obj-dg-wrap',    !isEwg);
    set('obj-keller-wrap',!isEwg);
    set('obj-etage-wrap',  isEwg);
    set('obj-einh-wrap',   isEwg);
    // Wohnflächen-Label bei ZFH-Wechsel aktualisieren
    const wfLbl = document.querySelector('label[for="obj-wohnflaeche"]') || document.getElementById('obj-wohnflaeche')?.closest('.field')?.querySelector('label');
    if (wfLbl) wfLbl.textContent = 'Wohnfläche' + (isZfh ? ' Einheit 1' : '');
  };
  $$('#objTypChoices .choice').forEach(c => c.addEventListener('click', () => {
    d.obj.typ = c.dataset.otyp;
    $$('#objTypChoices .choice').forEach(x => x.classList.toggle('selected', x === c));
    applyObjTypVisibility();
  }));

  // Text-/Zahlen-Bindings für alle Objekt-Felder
  const bindObj = (id, key, num = false) => {
    const el = document.getElementById(id); if (!el) return;
    el.addEventListener('input', () => { d.obj[key] = num ? numFrom(el.value) : el.value; });
  };
  bindObj('obj-strasse',      'strasse');
  bindObj('obj-hausnr',       'hausnr');
  bindObj('obj-plz',          'plz');
  bindObj('obj-ort',          'ort');
  bindObj('obj-wohnflaeche',  'wohnflaeche', true);
  bindObj('obj-wohnflaeche2', 'wohnflaeche2', true);
  bindObj('obj-grundstueck',  'grundstueck', true);
  bindObj('obj-baujahr',      'baujahr', true);
  bindObj('obj-vollgeschosse','vollgeschosse', true);
  bindObj('obj-etage',        'etage');
  bindObj('obj-einheiten',    'einheitenGebaeude', true);
  bindObj('obj-modVergangen', 'modVergangen');
  bindObj('obj-modGeplant',   'modGeplant');
  const ba = document.getElementById('obj-bauart');
  if (ba) ba.addEventListener('change', e => { d.obj.bauart = e.target.value; });
  const kel = document.getElementById('obj-keller');
  if (kel) kel.addEventListener('change', e => { d.obj.keller = e.target.value; });
  const dg = document.getElementById('obj-dgAusgebaut');
  if (dg) dg.addEventListener('change', e => {
    d.obj.dgAusgebaut = e.target.checked;
    const span = dg.parentElement.querySelector('span');
    if (span) span.textContent = e.target.checked ? 'ja' : 'nein';
  });

  // NK an/aus
  $$('[data-nkon]').forEach(inp => inp.addEventListener('change', e => {
    const key = e.target.dataset.nkon;
    d[key].on = e.target.checked;
    refresh();
  }));

  // NK Prozentsätze
  $$('[data-nkpct]').forEach(inp => inp.addEventListener('input', e => {
    const key = e.target.dataset.nkpct;
    const v = numFrom(e.target.value);
    d[key].pct = Math.max(0, Math.min(20, v));
    refresh();
  }));

  // Eigenkapital: Slider + Input synchron
  const eqSlider = document.getElementById('eq');
  const eqInput = document.getElementById('eqInput');
  eqSlider.addEventListener('input', () => {
    d.equity = parseFloat(eqSlider.value);
    eqInput.value = d.equity;
    refresh();
  });
  eqInput.addEventListener('input', () => {
    d.equity = Math.max(0, numFrom(eqInput.value));
    eqSlider.value = Math.min(100000, d.equity);
    refresh();
  });

  // Chips
  $$('.try-chip').forEach(c => c.addEventListener('click', () => {
    const t = c.dataset.t;
    if (t === 'eq-cover-nk') d.equity = d.extraCosts;
    if (t === 'eq-20')       d.equity = Math.round(d.propertyPrice * 0.20);
    if (t === 'eq-zero')     d.equity = 0;
    eqInput.value = d.equity;
    eqSlider.value = Math.min(100000, d.equity);
    refresh();
  }));

  refresh();
};

/* --- RATES --- */
views.wire_rates = () => {
  const refresh = () => {
    const f = calcFinance();
    const pct = f.spielraum > 0 ? (state.data.wishRate / f.spielraum) * 100 : 0;
    let verdict = '';
    if (!f.spielraum) verdict = 'Kein Spielraum aus Ihrer Situation — bitte prüfen Sie Einnahmen &amp; Ausgaben.';
    else if (state.data.wishRate <= 0) verdict = 'Tragen Sie Ihre Wunschrate ein — die Einordnung erscheint sofort.';
    else if (pct < 60) verdict = `<b>Sehr entspannt.</b> Nur ${pct.toFixed(0)} % Ihres Spielraums.`;
    else if (pct < 85) verdict = `<b>Wohlfühlbereich.</b> ${pct.toFixed(0)} % Ihres Spielraums — der klassische Zielkorridor.`;
    else if (pct <= 100) verdict = `<b>Sportlich.</b> ${pct.toFixed(0)} % Ihres Spielraums. Wenig Puffer für Unerwartetes.`;
    else verdict = `<span style="color:var(--danger)"><b>Über Ihrem Spielraum.</b> Wir sollten den Rahmen anpassen.</span>`;
    if (state.data.maxRate < state.data.wishRate) verdict += `<br><span style="color:var(--danger)"><b>Maximalrate liegt unter Wunschrate — bitte prüfen.</b></span>`;
    $('#rateExplain').innerHTML = verdict;
  };
  const bindPair = (inputId, sliderId, key, touchedKey) => {
    const inp = document.getElementById(inputId);
    const sl  = document.getElementById(sliderId);
    inp.addEventListener('input', () => {
      // Leeres Feld nicht sofort auf 0 klemmen, damit Nutzer neu tippen kann
      if (inp.value === '') { state.data[key] = 0; state.data[touchedKey] = true; sl.value = 0; refresh(); renderLiveSummary(); return; }
      state.data[key] = Math.max(0, numFrom(inp.value));
      state.data[touchedKey] = true;
      sl.value = Math.min(3000, state.data[key]);
      refresh(); renderLiveSummary();
    });
    sl.addEventListener('input', () => {
      state.data[key] = parseFloat(sl.value);
      state.data[touchedKey] = true;
      inp.value = state.data[key];
      refresh(); renderLiveSummary();
    });
  };
  bindPair('wr', 'wrSlider', 'wishRate', 'wishRateTouched');
  bindPair('mr', 'mrSlider', 'maxRate', 'maxRateTouched');
  refresh();
};

views.wire_summary = () => {
  const p = $('#printBtn');
  if (p) p.addEventListener('click', () => {
    // Druck-Dokument mit aktuellem State (inkl. gerade getippter Kriterien) neu aufbauen
    const old = document.querySelector('.print-doc');
    if (old) {
      const tmp = document.createElement('div');
      tmp.innerHTML = printDoc();
      old.replaceWith(tmp.firstElementChild);
    }
    try { window.print(); }
    catch (e) { alert('Druck über den Button nicht möglich. Bitte im Browser Strg+P (Windows) oder Cmd+P (Mac) drücken.'); }
  });

  const d = state.data;
  const list = document.getElementById('critList');
  const add  = document.getElementById('critAdd');

  const render = () => {
    list.innerHTML = d.criteria.map(c => `
      <div class="crit-row ${c.done?'done':''}" data-id="${c.id}">
        <input type="checkbox" ${c.done?'checked':''}>
        <input type="text" value="${c.text.replace(/"/g,'&quot;')}" placeholder="z. B. Zinsbindung mindestens 10 Jahre">
        <button class="del" title="Entfernen">✕</button>
      </div>
    `).join('');
    wire();
  };
  const wire = () => {
    list.querySelectorAll('.crit-row').forEach(row => {
      const id = row.dataset.id;
      const item = d.criteria.find(x => x.id === id);
      const chk = row.querySelector('input[type=checkbox]');
      const txt = row.querySelector('input[type=text]');
      const del = row.querySelector('.del');
      chk.addEventListener('change', () => { item.done = chk.checked; row.classList.toggle('done', chk.checked); });
      txt.addEventListener('input', () => { item.text = txt.value; });
      del.addEventListener('click', () => { d.criteria = d.criteria.filter(x => x.id !== id); render(); });
    });
  };

  add.addEventListener('click', () => {
    d.criteria.push({ id: uid(), text: '', done: false });
    render();
    // Focus auf das neue Text-Feld
    const rows = list.querySelectorAll('.crit-row');
    const last = rows[rows.length - 1];
    if (last) last.querySelector('input[type=text]').focus();
  });

  // Initial: mindestens eine Vorlage-Zeile, damit der Bereich nicht leer aussieht
  if (d.criteria.length === 0) {
    d.criteria.push({ id: uid(), text: '', done: false });
  }
  render();
};

/* ============================================================
   CHARTS
   ============================================================ */
function ctx(id) {
  const c = document.getElementById(id); if (!c) return null;
  const dpr = window.devicePixelRatio || 1;
  // Logische Größe FIXIEREN, um Rückkopplung width-Attr ↔ Layout zu verhindern
  const rect = c.getBoundingClientRect();
  const cssW = rect.width  || parseFloat(c.getAttribute('width'))  || 300;
  const cssH = rect.height || parseFloat(c.getAttribute('height')) || 200;
  c.style.width  = cssW + 'px';
  c.style.height = cssH + 'px';
  c.width  = Math.round(cssW * dpr);
  c.height = Math.round(cssH * dpr);
  const ct = c.getContext('2d'); ct.setTransform(1,0,0,1,0,0); ct.scale(dpr, dpr);
  return { ctx: ct, w: cssW, h: cssH };
}
function themeColor(name) { return getComputedStyle(document.documentElement).getPropertyValue('--' + name).trim(); }

function drawPie(eq, loan) {
  const g = ctx('pieChart'); if (!g) return;
  const { ctx: c, w, h } = g;
  c.clearRect(0, 0, w, h);
  const total = Math.max(1, eq + loan);
  const cx = w / 2, cy = h / 2;
  const r = Math.min(w, h) / 2 - 6;
  const eqAngle = (eq / total) * Math.PI * 2;
  // Eigenkapital (grün)
  c.beginPath();
  c.moveTo(cx, cy);
  c.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + eqAngle);
  c.closePath();
  c.fillStyle = themeColor('sage');
  c.fill();
  // Darlehen (Ziegel)
  c.beginPath();
  c.moveTo(cx, cy);
  c.arc(cx, cy, r, -Math.PI / 2 + eqAngle, -Math.PI / 2 + Math.PI * 2);
  c.closePath();
  c.fillStyle = themeColor('brick');
  c.fill();
  // Zentrierter Prozentwert (EK-Anteil)
  const pct = Math.round((eq / total) * 100);
  c.fillStyle = themeColor('bg-elev');
  c.beginPath();
  c.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = themeColor('ink');
  c.font = 'bold 22px Georgia, serif';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(pct + ' %', cx, cy - 6);
  c.font = '10px system-ui, sans-serif';
  c.fillStyle = themeColor('ink-mute');
  c.fillText('Eigenkapital', cx, cy + 12);
  c.textAlign = 'start';
  c.textBaseline = 'alphabetic';
}

/* ============================================================
   THEME
   ============================================================ */
$('#themebtn').addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const now = current === 'dark' ? 'light' : (current === 'light' ? 'dark' : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
  document.documentElement.setAttribute('data-theme', now);
  renderStage();
});
